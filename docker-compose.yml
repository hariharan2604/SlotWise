services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: slotwise-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Password123"
    ports:
      - "1433:1433"
    volumes:
      - slotwise-sql-data:/var/opt/mssql
volumes:
  slotwise-sql-data:
